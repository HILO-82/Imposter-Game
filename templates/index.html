{% extends "base.html" %}
{% block title %}Imposter Game{% endblock %}
{% block content %}
<div class="game-container max-w-2xl mx-auto rounded-2xl shadow-2xl overflow-hidden">
    <div class="text-center">
        <div class="bg-purple-100 p-8">
            <h1 class="text-5xl font-bold text-purple-800 mb-2"><i class="fas fa-user-astronaut"></i> IMPOSTER</h1>
            <p class="text-gray-600">Social deduction word game</p>
        </div>
        <div class="p-8 space-y-6">
            <p class="text-gray-700 text-lg">Choose how you want to play:</p>

            <a href="{{ url_for('game.setup_form') }}"
               class="btn flex items-center justify-between bg-purple-600 hover:bg-purple-700 text-white font-bold py-4 px-6 rounded-xl w-full text-lg">
                <span><i class="fas fa-mobile-alt mr-3"></i> Single Device</span>
                <span class="text-purple-200 text-sm">Pass-and-play</span>
            </a>

            <a href="{{ url_for('game.multi_host_setup') }}"
               class="btn flex items-center justify-between bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-6 rounded-xl w-full text-lg">
                <span><i class="fas fa-wifi mr-3"></i> Multi Device</span>
                <span class="text-blue-200 text-sm">Each player on their own device</span>
            </a>

            <a href="{{ url_for('settings.settings_page') }}"
               class="btn flex items-center justify-between bg-gray-600 hover:bg-gray-700 text-white font-bold py-4 px-6 rounded-xl w-full text-lg">
                <span><i class="fas fa-cog mr-3"></i> Settings</span>
                <span class="text-gray-300 text-sm">Default game options</span>
            </a>
        </div>
    </div>
</div>
{% endblock %}
