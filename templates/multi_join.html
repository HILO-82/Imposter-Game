{% extends "base.html" %}
{% block title %}Join Game{% endblock %}
{% block content %}
<div class="game-container max-w-md mx-auto rounded-2xl shadow-2xl p-8 text-center">
    <div class="text-6xl mb-4"><i class="fas fa-user-astronaut text-blue-600"></i></div>
    <h1 class="text-3xl font-bold text-blue-800 mb-2">Join Game</h1>
    <p class="text-gray-600 mb-6">Select your name to join</p>

    {% if error %}
    <div class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mb-4 text-sm">{{ error }}</div>
    {% endif %}

    <form action="{{ url_for('game.multi_join_post', code=code) }}" method="POST" class="space-y-3">
        {% for p in unclaimed %}
        <button type="submit" name="player_id" value="{{ p.player_id }}"
            class="w-full px-4 py-3 rounded-lg border-2 border-blue-300 hover:border-blue-500 hover:bg-blue-50 focus:outline-none text-lg font-medium transition">
            <i class="fas fa-user-circle"></i> {{ p.name }}
        </button>
        {% endfor %}
    </form>
</div>
{% endblock %}
