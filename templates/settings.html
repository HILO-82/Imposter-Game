{% extends "base.html" %}
{% block title %}Settings{% endblock %}
{% block content %}
<div class="game-container max-w-lg mx-auto rounded-2xl shadow-2xl p-8">
    <div class="text-center mb-6">
        <h1 class="text-4xl font-bold text-purple-800"><i class="fas fa-cog"></i> Settings</h1>
    </div>

    <div class="flex border-b-2 border-gray-200 mb-6">
        <a href="{{ url_for('settings.settings_page', tab='game') }}"
           class="px-4 py-2 font-semibold text-sm border-b-2 -mb-0.5 transition {% if active_tab == 'game' %}text-purple-700 border-purple-500{% else %}text-gray-500 border-transparent hover:text-gray-700{% endif %}">
            <i class="fas fa-gamepad"></i> Game Defaults
        </a>
        <a href="{{ url_for('settings.settings_page', tab='app') }}"
           class="px-4 py-2 font-semibold text-sm border-b-2 -mb-0.5 transition {% if active_tab == 'app' %}text-purple-700 border-purple-500{% else %}text-gray-500 border-transparent hover:text-gray-700{% endif %}">
            <i class="fas fa-palette"></i> App Options
        </a>
    </div>

    {% if active_tab == "game" %}
    <form method="POST" action="{{ url_for('settings.settings_page') }}" class="space-y-6">
        <input type="hidden" name="tab" value="game">
        <div class="bg-gray-50 rounded-xl p-4">
            <h3 class="font-semibold text-lg mb-3"><i class="fas fa-users"></i> Default Player Count</h3>
            <select name="player_count" class="w-full px-3 py-2 border-2 border-purple-300 rounded-lg text-sm">
                {% for n in range(3, 9) %}
                <option value="{{ n }}" {% if settings.default_player_count == n %}selected{% endif %}>{{ n }} players</option>
                {% endfor %}
            </select>
        </div>

        <div class="grid md:grid-cols-2 gap-4">
            <div class="bg-gray-50 rounded-xl p-4">
                <h3 class="font-semibold text-lg mb-3"><i class="fas fa-cog"></i> Game Defaults</h3>
                <div class="space-y-3">
                    <div>
                        <label class="text-sm font-medium">Default Imposters</label>
                        <select name="imposter_count" class="w-full px-3 py-2 border-2 border-purple-300 rounded-lg text-sm">
                            {% for n in range(1, 5) %}
                            <option value="{{ n }}" {% if settings.default_imposter_count == n %}selected{% endif %}>{{ n }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="text-sm font-medium">Default Jesters</label>
                        <select name="jester_count" class="w-full px-3 py-2 border-2 border-purple-300 rounded-lg text-sm">
                            {% for n in range(0, 3) %}
                            <option value="{{ n }}" {% if settings.default_jester_count == n %}selected{% endif %}>{{ n }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="text-sm font-medium">Jester Info Level</label>
                        <select name="jester_info" class="w-full px-3 py-2 border-2 border-purple-300 rounded-lg text-sm">
                            <option value="nothing" {% if settings.default_jester_info == 'nothing' %}selected{% endif %}>Nothing</option>
                            <option value="category" {% if settings.default_jester_info == 'category' %}selected{% endif %}>Category</option>
                            <option value="partial" {% if settings.default_jester_info == 'partial' %}selected{% endif %}>Partial</option>
                            <option value="full" {% if settings.default_jester_info == 'full' %}selected{% endif %}>Full</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="bg-gray-50 rounded-xl p-4">
                <h3 class="font-semibold text-lg mb-3"><i class="fas fa-tag"></i> Default Category</h3>
                <div class="space-y-3">
                    <div>
                        <label class="text-sm font-medium">Word Category</label>
                        <select name="category" class="w-full px-3 py-2 border-2 border-purple-300 rounded-lg text-sm">
                            {% for c in categories %}
                            <option value="{{ c }}" {% if settings.default_category == c %}selected{% endif %}>{{ c }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <button type="submit" class="btn bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-8 rounded-xl w-full text-lg">
            <i class="fas fa-save"></i> Save Settings
        </button>
    </form>
    {% else %}
    <form method="POST" action="{{ url_for('settings.settings_page') }}" class="space-y-6">
        <input type="hidden" name="tab" value="app">
        <div class="bg-gray-50 rounded-xl p-6">
            <h3 class="font-semibold text-lg mb-4"><i class="fas fa-palette"></i> Appearance</h3>
            <label class="flex items-center justify-between cursor-pointer">
                <span class="text-base font-medium">Dark Mode</span>
                <div class="relative">
                    <input type="checkbox" name="dark_mode" class="sr-only peer" {% if settings.dark_mode %}checked{% endif %}>
                    <div class="w-11 h-6 bg-gray-300 peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-purple-300 rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-0.5 after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-purple-600"></div>
                </div>
            </label>
        </div>
        <button type="submit" class="btn bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-8 rounded-xl w-full text-lg">
            <i class="fas fa-save"></i> Save Settings
        </button>
    </form>
    {% endif %}

    <div class="text-center mt-4">
        <a href="{{ url_for('lobby.index') }}" class="btn inline-block bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded-lg text-sm">
            <i class="fas fa-arrow-left"></i> Back
        </a>
    </div>
</div>
{% endblock %}
