{% extends "base.html" %}
{% block title %}Multi-Device Game{% endblock %}
{% block content %}
<div class="game-container max-w-lg mx-auto rounded-2xl shadow-2xl p-8">
    <div class="text-center mb-6">
        <h2 class="text-3xl font-bold text-blue-800"><i class="fas fa-wifi"></i> Multi-Device Game</h2>
        <p class="text-gray-600 mt-1">Players scan the QR code on their own device</p>
    </div>

    <div class="bg-gray-50 rounded-xl p-6 text-center">
        <h3 class="font-semibold text-lg mb-4"><i class="fas fa-qrcode"></i> Scan to Join</h3>
        <img src="{{ qr_data_uri }}" alt="QR Code" class="mx-auto mb-4">
        <p class="text-sm text-gray-600 break-all bg-white rounded p-2">{{ join_url }}</p>
    </div>

    <div class="mt-6 flex gap-3">
        <a href="{{ url_for('game.game_stats', game_id=game.game_id) }}" class="btn flex-1 bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl text-lg text-center">
            <i class="fas fa-chart-bar"></i> Game Stats
        </a>
        <a href="{{ url_for('lobby.index') }}" class="btn flex-1 bg-gray-500 hover:bg-gray-600 text-white font-bold py-3 rounded-xl text-lg text-center">
            <i class="fas fa-home"></i> Home
        </a>
    </div>
</div>
{% endblock %}
