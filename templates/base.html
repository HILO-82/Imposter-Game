<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Imposter{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    {% block head %}{% endblock %}
</head>
<body class="font-sans">
    <div id="app" class="min-h-screen p-4">
        {% block content %}{% endblock %}
    </div>
    <script>
        const socket = io();
        
        socket.on('connect', function() {
            console.log('Connected to server');
        });
        
        socket.on('disconnect', function() {
            console.log('Disconnected from server');
        });
        
        socket.on('player_joined', function(data) {
            console.log('Player joined:', data);
            // Refresh the page to show updated player list
            if (document.querySelector('[data-phase="room_lobby"]')) {
                location.reload();
            }
        });
        
        socket.on('game_started', function(data) {
            console.log('Game started:', data);
            // Only redirect if not already on role reveal page
            const currentPath = window.location.pathname;
            if (currentPath.includes('/role-reveal')) {
                console.log('Already on role reveal page, not redirecting');
                return;
            }
            // Redirect to role reveal page with player token
            const playerToken = '{{ session.get("player_token") }}';
            if (playerToken && data.room_code) {
                window.location.href = '/room/' + data.room_code + '/player/' + playerToken;
            } else {
                location.reload();
            }
        });
        
        socket.on('phase_changed', function(data) {
            console.log('Phase changed:', data);
            location.reload();
        });
    </script>
</body>
</html>
